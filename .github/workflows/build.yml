name: Build Ukiyo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Sanitize assets to valid PNG
        continue-on-error: true
        run: |
          for f in assets/*; do
            [ -f "$f" ] || continue
            case "${f,,}" in
              *.png|*.jpg|*.jpeg|*.webp)
                out="${f%.*}.png"
                convert "$f" -resize 1024x1024 -background black -gravity center -extent 1024x1024 PNG24:"$out" || true
                echo "OK $out"
                ;;
            esac
          done

      - name: Expo Prebuild (Android)
        env:
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with repo keystore
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          echo "Using build-tools $BT"
          ZIPALIGN="$SDK/build-tools/$BT/zipalign"
          APKSIGNER="$SDK/build-tools/$BT/apksigner"

          RELEASE_DIR="android/app/build/outputs/apk/release"
          APK=$(ls "$RELEASE_DIR"/*.apk | head -1)
          echo "Input: $APK"

          base64 -d android-signing/keystore.b64 > /tmp/ukiyo.keystore

          ALIGNED="/tmp/ukiyo-aligned.apk"
          SIGNED="$RELEASE_DIR/ukiyo-release-signed.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/ukiyo.keystore \
            --ks-key-alias ukiyo \
            --ks-pass "pass:UkiyoKokoro2026!" \
            --key-pass "pass:UkiyoKokoro2026!" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"
          rm -f /tmp/ukiyo.keystore /tmp/ukiyo-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ukiyo-release
          path: android/app/build/outputs/apk/release/ukiyo-release-signed.apk
